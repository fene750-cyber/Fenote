<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Fenote — Elegant Note Taking</title>
  <meta name="description" content="Modern, clean, and elegant note-taking workspace with auto-save, categories, pinning, and dark mode." />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              200: '#c7d2fe',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
            }
          }
        }
      }
    };
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Typography and Editor Styles -->
  <style>
    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.35); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.6); }

    /* Contenteditable Placeholder */
    [contenteditable]:empty:before {
      content: attr(data-placeholder);
      color: #94a3b8;
      pointer-events: none;
      display: block;
    }
    .dark [contenteditable]:empty:before { color: #64748b; }

    #editor-body:focus { outline: none; }
    #editor-body h1 {
      font-size: 1.875rem;
      font-weight: 700;
      line-height: 1.25;
      margin-top: 1.25rem;
      margin-bottom: 0.6rem;
      letter-spacing: -0.025em;
    }
    #editor-body h2 {
      font-size: 1.4rem;
      font-weight: 600;
      line-height: 1.35;
      margin-top: 1rem;
      margin-bottom: 0.45rem;
      letter-spacing: -0.02em;
    }
    #editor-body h3 {
      font-size: 1.15rem;
      font-weight: 600;
      margin-top: 0.85rem;
      margin-bottom: 0.35rem;
    }
    #editor-body p { margin-bottom: 0.75rem; line-height: 1.65; }
    #editor-body ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 0.75rem; }
    #editor-body ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 0.75rem; }
    #editor-body li { margin-bottom: 0.2rem; line-height: 1.6; }
    #editor-body blockquote {
      border-left: 3.5px solid #6366f1;
      padding-left: 1rem;
      font-style: italic;
      color: #475569;
      margin: 0.85rem 0;
    }
    .dark #editor-body blockquote {
      border-left-color: #818cf8;
      color: #94a3b8;
    }
    #editor-body pre {
      background: rgba(15, 23, 42, 0.05);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.875rem;
      margin: 0.75rem 0;
      overflow-x: auto;
    }
    .dark #editor-body pre {
      background: rgba(15, 23, 42, 0.6);
      border-color: rgba(148, 163, 184, 0.15);
    }
    #editor-body code {
      background: rgba(148, 163, 184, 0.15);
      padding: 0.12rem 0.35rem;
      border-radius: 0.25rem;
      font-size: 0.875em;
      font-family: 'JetBrains Mono', monospace;
    }
    #editor-body hr {
      border: none;
      border-top: 1px solid rgba(148, 163, 184, 0.25);
      margin: 1.25rem 0;
    }
  </style>
</head>

<body class="h-full bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 flex overflow-hidden font-sans antialiased selection:bg-brand-500 selection:text-white transition-colors duration-150">

  <!-- Mobile Backdrop Overlay -->
  <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-30 hidden lg:hidden"></div>

  <!-- ==================== SIDEBAR ==================== -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-80 bg-white dark:bg-slate-900 border-r border-slate-200/80 dark:border-slate-800 flex flex-col transition-transform duration-300 -translate-x-full lg:static lg:translate-x-0 shadow-xl lg:shadow-none shrink-0">
    
    <!-- App Header & Logo: Notebook (Kouvèti) + Pencil (Kreyon) -->
    <div class="px-5 py-4 border-b border-slate-200/80 dark:border-slate-800 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <!-- Custom SVG Logo -->
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-600 via-indigo-700 to-indigo-900 flex items-center justify-center shadow-md shadow-indigo-500/20 text-white shrink-0">
          <svg class="w-6 h-6" viewBox="0 0 48 48" fill="none">
            <!-- Notebook Cover & Spine -->
            <rect x="7" y="6" width="26" height="36" rx="4.5" fill="rgba(255,255,255,0.15)" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
            <line x1="13.5" y1="6" x2="13.5" y2="42" stroke="#ffffff" stroke-width="2" stroke-dasharray="2 3" stroke-linecap="round" opacity="0.8" />
            <!-- Interior Page Lines -->
            <line x1="18.5" y1="14" x2="28" y2="14" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.85" />
            <line x1="18.5" y1="20" x2="28" y2="20" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.85" />
            <line x1="18.5" y1="26" x2="25" y2="26" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7" />
            <!-- Slanted Pencil -->
            <g transform="rotate(-36 32 26)">
              <rect x="29" y="8" width="6" height="4" rx="1.5" fill="#f43f5e" />
              <rect x="29" y="12" width="6" height="2" fill="#cbd5e1" />
              <rect x="29" y="14" width="6" height="15" fill="#fbbf24" stroke="#d97706" stroke-width="0.5" />
              <polygon points="29,29 35,29 32,36" fill="#fef3c7" stroke="#d97706" stroke-width="0.5" />
              <polygon points="31,34 33,34 32,36" fill="#1e293b" />
            </g>
          </svg>
        </div>
        <div>
          <h1 class="text-xl font-bold tracking-tight text-slate-900 dark:text-white flex items-center gap-1">Fenote</h1>
          <p class="text-[10px] font-semibold text-brand-600 dark:text-brand-400 tracking-wider uppercase">Workspace</p>
        </div>
      </div>

      <div class="flex items-center gap-1">
        <!-- Theme Toggle -->
        <button id="theme-toggle" title="Toggle Theme" class="p-2 rounded-lg text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-100 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
          <i data-lucide="sun" class="w-4 h-4 hidden dark:block text-amber-400"></i>
          <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
        </button>
        <!-- Mobile Close -->
        <button id="close-sidebar-btn" class="p-2 rounded-lg text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 lg:hidden">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
    </div>

    <!-- Actions: New Note & Search -->
    <div class="p-4 space-y-3">
      <button id="new-note-btn" class="w-full py-2.5 px-4 bg-brand-600 hover:bg-brand-700 active:scale-[0.99] text-white font-medium rounded-xl shadow-sm shadow-brand-500/20 flex items-center justify-center gap-2 transition duration-150 text-sm">
        <i data-lucide="plus" class="w-4 h-4 stroke-[2.5]"></i>
        <span>New Note</span>
        <span class="text-[10px] bg-white/20 px-1.5 py-0.5 rounded ml-auto font-mono hidden sm:inline">Ctrl+N</span>
      </button>

      <!-- Search Input -->
      <div class="relative">
        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2.5 text-slate-400"></i>
        <input 
          id="search-input" 
          type="text" 
          placeholder="Search notes or tags..." 
          class="w-full pl-9 pr-8 py-2 text-sm bg-slate-100 dark:bg-slate-800/80 text-slate-800 dark:text-slate-200 rounded-xl border border-transparent focus:border-brand-500/50 focus:bg-white dark:focus:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-500/20 transition"
        />
        <button id="clear-search-btn" class="absolute right-2.5 top-2.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hidden">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- Category / Filter Navigation -->
    <div class="px-3 pb-2 border-b border-slate-200/80 dark:border-slate-800">
      <div class="grid grid-cols-4 gap-1 text-xs">
        <button data-filter="all" class="filter-tab py-1.5 px-1.5 rounded-lg text-center font-medium transition bg-brand-50 dark:bg-brand-950/60 text-brand-700 dark:text-brand-300 font-semibold">
          All (<span id="all-count">0</span>)
        </button>
        <button data-filter="pinned" class="filter-tab py-1.5 px-1.5 rounded-lg text-center font-medium transition text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/60">
          Pinned (<span id="pinned-count">0</span>)
        </button>
        <button data-filter="favorite" class="filter-tab py-1.5 px-1.5 rounded-lg text-center font-medium transition text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/60">
          Starred (<span id="starred-count">0</span>)
        </button>
        <button data-filter="trash" class="filter-tab py-1.5 px-1.5 rounded-lg text-center font-medium transition text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/60">
          Trash (<span id="trash-count">0</span>)
        </button>
      </div>

      <!-- Categories Pills -->
      <div class="mt-2.5 pt-2 border-t border-slate-100 dark:border-slate-800/60 flex items-center justify-between">
        <span class="text-[10px] font-semibold tracking-wider text-slate-400 uppercase">Tags</span>
        <button id="add-tag-prompt" class="text-slate-400 hover:text-brand-600 text-xs transition" title="Add new tag">+ Tag</button>
      </div>
      <div id="category-pills" class="mt-1.5 flex gap-1 overflow-x-auto pb-1 text-xs">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <!-- Notes List -->
    <div id="notes-list" class="flex-1 overflow-y-auto px-3 py-2 space-y-1.5">
      <!-- Populated by JavaScript -->
    </div>

    <!-- Footer Stats & Export -->
    <div class="p-3 border-t border-slate-200/80 dark:border-slate-800 flex items-center justify-between text-xs text-slate-500 dark:text-slate-400 bg-slate-50/50 dark:bg-slate-900/50">
      <span id="note-count">0 Notes</span>
      <div class="flex items-center gap-2">
        <button onclick="exportJSONBackup()" class="flex items-center gap-1 hover:text-brand-600 transition" title="Export Backup JSON">
          <i data-lucide="download" class="w-3 h-3"></i> Backup
        </button>
        <label class="flex items-center gap-1 hover:text-brand-600 transition cursor-pointer" title="Import Backup JSON">
          <i data-lucide="upload" class="w-3 h-3"></i> Import
          <input type="file" id="import-json-input" accept=".json" class="hidden" onchange="importJSONBackup(event)" />
        </label>
      </div>
    </div>
  </aside>

  <!-- ==================== MAIN WORKSPACE ==================== -->
  <main class="flex-1 flex flex-col h-full bg-white dark:bg-slate-950 overflow-hidden relative">
    
    <!-- Navbar Header -->
    <header class="h-14 border-b border-slate-200/80 dark:border-slate-800/80 px-4 sm:px-6 flex items-center justify-between bg-white/90 dark:bg-slate-950/90 backdrop-blur-md z-10 shrink-0">
      <div class="flex items-center gap-3">
        <button id="open-sidebar-btn" class="lg:hidden p-2 -ml-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>

        <!-- Save Indicator -->
        <div id="autosave-status" class="flex items-center gap-1.5 text-xs text-slate-400">
          <i data-lucide="check-circle-2" class="w-3.5 h-3.5 text-emerald-500"></i>
          <span class="font-medium text-slate-500 dark:text-slate-400">Saved</span>
        </div>
      </div>

      <!-- Action Items for current note -->
      <div id="note-actions" class="flex items-center gap-1.5">
        <!-- Tag Selector -->
        <select id="editor-tag-select" class="text-xs bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700 rounded-lg px-2.5 py-1.5 focus:outline-none cursor-pointer">
          <option value="Personal">Personal</option>
          <option value="Work">Work</option>
          <option value="Ideas">Ideas</option>
          <option value="Study">Study</option>
          <option value="Journal">Journal</option>
        </select>

        <!-- Pin Button -->
        <button id="pin-note-btn" title="Pin note to top" class="p-2 rounded-lg text-slate-400 hover:text-amber-500 hover:bg-amber-50 dark:hover:bg-slate-800 transition">
          <i data-lucide="pin" class="w-4 h-4"></i>
        </button>

        <!-- Star/Favorite Button -->
        <button id="favorite-note-btn" title="Favorite note" class="p-2 rounded-lg text-slate-400 hover:text-amber-400 hover:bg-amber-50 dark:hover:bg-slate-800 transition">
          <i data-lucide="star" class="w-4 h-4"></i>
        </button>

        <!-- Duplicate Button -->
        <button id="duplicate-note-btn" title="Duplicate note" class="p-2 rounded-lg text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition hidden sm:inline-flex">
          <i data-lucide="copy" class="w-4 h-4"></i>
        </button>

        <!-- Export Markdown -->
        <button id="export-md-btn" title="Download Markdown (.md)" class="p-2 rounded-lg text-slate-400 hover:text-brand-600 hover:bg-slate-100 dark:hover:bg-slate-800 transition">
          <i data-lucide="download" class="w-4 h-4"></i>
        </button>

        <!-- Delete Button -->
        <button id="delete-note-btn" title="Delete note" class="p-2 rounded-lg text-slate-400 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-slate-800 transition">
          <i data-lucide="trash-2" class="w-4 h-4"></i>
        </button>
      </div>
    </header>

    <!-- WYSIWYG Formatting Toolbar -->
    <div id="formatting-bar" class="px-4 py-1.5 border-b border-slate-200/80 dark:border-slate-800 bg-slate-50/80 dark:bg-slate-900/60 backdrop-blur-sm flex items-center gap-0.5 overflow-x-auto text-slate-600 dark:text-slate-400 select-none">
      <button onclick="formatDoc('bold')" title="Bold (Ctrl+B)" class="p-1.5 rounded hover:bg-slate-200 dark:hover:bg-slate-800"><i data-lucide="bold" class="w-4 h-4"></i></button>
      <button onclick="formatDoc('italic')" title="Italic (Ctrl+I)" class="p-1.5 rounded hover:bg-slate-200 dark:hover:bg-slate-800"><i data-lucide="italic" class="w-4 h-4"></i></button>
      <button onclick="formatDoc('underline')" title="Underline (Ctrl+U)" class="p-1.5 rounded hover:bg-slate-200 dark:hover:bg-slate-800"><i data-lucide="underline" class="w-4 h-4"></i></button>
      <button onclick="formatDoc('strikeThrough')" title="Strikethrough" class="p-1.5 rounded hover:bg-slate-200 dark:hover:bg-slate-800"><i data-lucide="strikethrough" class="w-4 h-4"></i></button>
      <div class="w-px h-4 bg-slate-200 dark:bg-slate-700 mx-1"></div>
      <button onclick="formatDoc('formatBlock', '<h1>')" title="Heading 1" class="p-1.5 rounded hover:bg-slate-200 dark:hover:bg-slate-800"><i data-lucide="heading-1" class="w-4 h-4"></i></button>
      <button onclick="formatDoc('formatBlock', '<h2>')" title="Heading 2" class="p-1.5 rounded hover:bg-slate-200 dark:hover:bg-slate-800"><i data-lucide="heading-2" class="w-4 h-4"></i></button>
      <button onclick="formatDoc('formatBlock', '<h3>')" title="Heading 3" class="p-1.5 rounded hover:bg-slate-200 dark:hover:bg-slate-800"><i data-lucide="heading-3" class="w-4 h-4"></i></button>
      <button onclick="formatDoc('formatBlock', '<p>')" title="Paragraph" class="px-2 py-1 text-xs font-semibold rounded hover:bg-slate-200 dark:hover:bg-slate-800">Body</button>
      <div class="w-px h-4 bg-slate-200 dark:bg-slate-700 mx-1"></div>
      <button onclick="formatDoc('insertUnorderedList')" title="Bullet List" class="p-1.5 rounded hover:bg-slate-200 dark:hover:bg-slate-800"><i data-lucide="list" class="w-4 h-4"></i></button>
      <button onclick="formatDoc('insertOrderedList')" title="Numbered List" class="p-1.5 rounded hover:bg-slate-200 dark:hover:bg-slate-800"><i data-lucide="list-ordered" class="w-4 h-4"></i></button>
      <button onclick="formatDoc('formatBlock', '<blockquote>')" title="Quote" class="p-1.5 rounded hover:bg-slate-200 dark:hover:bg-slate-800"><i data-lucide="quote" class="w-4 h-4"></i></button>
      <button onclick="insertCodeSnippet()" title="Code Block" class="p-1.5 rounded hover:bg-slate-200 dark:hover:bg-slate-800"><i data-lucide="code" class="w-4 h-4"></i></button>
      <div class="w-px h-4 bg-slate-200 dark:bg-slate-700 mx-1"></div>
      <button onclick="formatDoc('removeFormat')" title="Clear Formatting" class="p-1.5 rounded hover:bg-slate-200 dark:hover:bg-slate-800 text-slate-400"><i data-lucide="remove-formatting" class="w-4 h-4"></i></button>
    </div>

    <!-- Writing Canvas -->
    <div id="editor-container" class="flex-1 overflow-y-auto px-6 sm:px-12 md:px-16 lg:px-24 py-8 max-w-4xl mx-auto w-full flex flex-col">
      <!-- Title Input -->
      <input 
        id="editor-title"
        type="text" 
        placeholder="Untitled Note..." 
        class="w-full text-3xl sm:text-4xl font-extrabold tracking-tight bg-transparent text-slate-900 dark:text-white placeholder-slate-300 dark:placeholder-slate-700 focus:outline-none border-none mb-6"
      />

      <!-- Contenteditable Body -->
      <div 
        id="editor-body" 
        contenteditable="true" 
        data-placeholder="Start typing your thoughts, ideas, or markdown here..."
        class="flex-1 min-h-[380px] text-slate-700 dark:text-slate-200 text-base leading-relaxed tracking-normal focus:outline-none pb-24"
      ></div>

      <!-- Stats Bar -->
      <div class="mt-auto pt-6 border-t border-slate-100 dark:border-slate-800/80 flex items-center justify-between text-xs text-slate-400 dark:text-slate-500 select-none">
        <div class="flex items-center gap-2">
          <span id="word-count">0 words</span>
          <span>·</span>
          <span id="char-count">0 characters</span>
          <span>·</span>
          <span id="reading-time">1 min read</span>
        </div>
        <div id="last-updated-text">Updated just now</div>
      </div>
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden absolute inset-0 flex flex-col items-center justify-center p-6 text-center bg-slate-50 dark:bg-slate-950">
      <div class="w-16 h-16 rounded-2xl bg-brand-50 dark:bg-brand-950/60 text-brand-600 flex items-center justify-center mb-4">
        <i data-lucide="file-plus" class="w-8 h-8"></i>
      </div>
      <h3 class="text-xl font-bold mb-1">No note selected</h3>
      <p class="text-slate-400 text-sm max-w-sm mb-6">Create a fresh note or select one from the left to start writing.</p>
      <button onclick="createNewNote()" class="py-2.5 px-5 bg-brand-600 text-white rounded-xl shadow-md text-sm font-medium hover:bg-brand-700 transition">
        Create a Note
      </button>
    </div>

  </main>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white dark:bg-white dark:text-slate-900 px-4 py-2.5 rounded-xl shadow-xl text-xs font-medium flex items-center gap-3 hidden transition-all duration-300">
    <span id="toast-message">Notification</span>
    <button id="toast-action" class="text-brand-400 dark:text-brand-600 font-semibold hover:underline hidden">Undo</button>
  </div>

  <!-- ==================== JAVASCRIPT LOGIC ==================== -->
  <script>
    const STORAGE_KEY = 'fenote_notes_app_data';
    const THEME_KEY = 'fenote_theme';
    const CATEGORIES_KEY = 'fenote_categories';

    const DEFAULT_CATEGORIES = ['Personal', 'Work', 'Ideas', 'Study', 'Journal'];
    const DEFAULT_NOTES = [
      {
        id: 'note-1',
        title: 'Welcome to Fenote ✨',
        content: '<h1>Getting Started with Fenote</h1><p>Welcome to <strong>Fenote</strong>, your elegant workspace for capturing thoughts and organizing projects.</p><h2>✨ Core Features</h2><ul><li><strong>Instant Auto-save:</strong> Every keystroke is saved directly into your browser local storage.</li><li><strong>Rich Text Toolbar:</strong> Headings, bold, italics, quotes, and lists.</li><li><strong>Categories & Organization:</strong> Sort notes by tags.</li><li><strong>Pinning:</strong> Keep your top priorities right at the top.</li></ul><blockquote>"Simplicity is the soul of efficiency."</blockquote>',
        category: 'Ideas',
        pinned: true,
        favorite: true,
        trashed: false,
        updatedAt: new Date().toISOString()
      },
      {
        id: 'note-2',
        title: 'Project Roadmap 🚀',
        content: '<h2>Milestones & Goals</h2><ol><li>Review app architecture</li><li>Export to GitHub Pages</li><li>Build APK using WebIntoApp</li></ol><p>Keep everything minimal and high-performing.</p>',
        category: 'Work',
        pinned: true,
        favorite: false,
        trashed: false,
        updatedAt: new Date(Date.now() - 3600000).toISOString()
      }
    ];

    let state = {
      notes: [],
      categories: [],
      activeNoteId: null,
      activeFilter: 'all',
      searchQuery: '',
      deletedCache: null,
    };

    let autoSaveTimeout = null;

    // Elements
    const notesListEl = document.getElementById('notes-list');
    const editorTitleEl = document.getElementById('editor-title');
    const editorBodyEl = document.getElementById('editor-body');
    const editorTagSelect = document.getElementById('editor-tag-select');
    const pinBtn = document.getElementById('pin-note-btn');
    const favoriteBtn = document.getElementById('favorite-note-btn');
    const deleteBtn = document.getElementById('delete-note-btn');
    const autosaveStatus = document.getElementById('autosave-status');
    const searchInput = document.getElementById('search-input');
    const clearSearchBtn = document.getElementById('clear-search-btn');
    const noteCountEl = document.getElementById('note-count');
    const emptyStateEl = document.getElementById('empty-state');
    const editorContainer = document.getElementById('editor-container');
    const formattingBar = document.getElementById('formatting-bar');
    const noteActions = document.getElementById('note-actions');
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebar-overlay');

    // Init App
    function init() {
      initTheme();
      loadData();
      setupEventListeners();
      renderCategoryPills();
      renderNotesList();
      loadActiveNote();
      lucide.createIcons();
    }

    function loadData() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        state.notes = stored ? JSON.parse(stored) : DEFAULT_NOTES;
      } catch (e) {
        state.notes = DEFAULT_NOTES;
      }
      try {
        const storedCats = localStorage.getItem(CATEGORIES_KEY);
        state.categories = storedCats ? JSON.parse(storedCats) : DEFAULT_CATEGORIES;
      } catch (e) {
        state.categories = DEFAULT_CATEGORIES;
      }
      const firstActive = state.notes.find(n => !n.trashed);
      state.activeNoteId = firstActive ? firstActive.id : (state.notes[0]?.id || null);
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.notes));
    }

    function saveCategories() {
      localStorage.setItem(CATEGORIES_KEY, JSON.stringify(state.categories));
    }

    function initTheme() {
      const isDark = localStorage.getItem(THEME_KEY) === 'dark' ||
        (!localStorage.getItem(THEME_KEY) && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (isDark) document.documentElement.classList.add('dark');
      else document.documentElement.classList.remove('dark');
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
      lucide.createIcons();
    }

    function stripHtml(html) {
      const tmp = document.createElement('div');
      tmp.innerHTML = html;
      return tmp.textContent || tmp.innerText || '';
    }

    function updateCounts() {
      const active = state.notes.filter(n => !n.trashed);
      document.getElementById('all-count').textContent = active.length;
      document.getElementById('pinned-count').textContent = active.filter(n => n.pinned).length;
      document.getElementById('starred-count').textContent = active.filter(n => n.favorite).length;
      document.getElementById('trash-count').textContent = state.notes.filter(n => n.trashed).length;
      noteCountEl.textContent = `${active.length} ${active.length === 1 ? 'Note' : 'Notes'}`;
    }

    function renderCategoryPills() {
      const container = document.getElementById('category-pills');
      container.innerHTML = state.categories.map(cat => {
        const isSel = state.activeFilter.toLowerCase() === cat.toLowerCase();
        return `<button onclick="setFilter('${cat}')" class="px-2.5 py-1 rounded-lg text-xs font-medium whitespace-nowrap transition ${
          isSel ? 'bg-slate-900 text-white dark:bg-white dark:text-slate-900 shadow-xs' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'
        }">${cat}</button>`;
      }).join('');

      editorTagSelect.innerHTML = state.categories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
    }

    function setFilter(filter) {
      state.activeFilter = filter;
      document.querySelectorAll('.filter-tab').forEach(b => {
        if (b.dataset.filter === filter) {
          b.className = 'filter-tab py-1.5 px-1.5 rounded-lg text-center font-medium transition bg-brand-50 dark:bg-brand-950/60 text-brand-700 dark:text-brand-300 font-semibold';
        } else {
          b.className = 'filter-tab py-1.5 px-1.5 rounded-lg text-center font-medium transition text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/60';
        }
      });
      renderCategoryPills();
      renderNotesList();
    }

    function renderNotesList() {
      updateCounts();
      let filtered = state.notes.filter(n => {
        if (state.activeFilter === 'trash') {
          if (!n.trashed) return false;
        } else {
          if (n.trashed) return false;
          if (state.activeFilter === 'pinned' && !n.pinned) return false;
          if (state.activeFilter === 'favorite' && !n.favorite) return false;
          if (state.activeFilter !== 'all' && state.activeFilter !== 'pinned' && state.activeFilter !== 'favorite') {
            if (n.category.toLowerCase() !== state.activeFilter.toLowerCase()) return false;
          }
        }
        if (!state.searchQuery.trim()) return true;
        const q = state.searchQuery.toLowerCase();
        return n.title.toLowerCase().includes(q) || stripHtml(n.content).toLowerCase().includes(q) || n.category.toLowerCase().includes(q);
      });

      filtered.sort((a, b) => {
        if (state.activeFilter !== 'pinned' && state.activeFilter !== 'trash' && a.pinned !== b.pinned) {
          return a.pinned ? -1 : 1;
        }
        return new Date(b.updatedAt) - new Date(a.updatedAt);
      });

      if (filtered.length === 0) {
        notesListEl.innerHTML = `
          <div class="py-12 text-center text-slate-400 px-4">
            <i data-lucide="file-text" class="w-8 h-8 mx-auto mb-2 opacity-40"></i>
            <p class="text-xs font-medium">No matching notes</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      notesListEl.innerHTML = filtered.map(note => {
        const isActive = note.id === state.activeNoteId;
        const snippet = stripHtml(note.content) || 'Empty note...';
        const dateStr = new Date(note.updatedAt).toLocaleDateString([], { month: 'short', day: 'numeric' });

        return `
          <div onclick="selectNote('${note.id}')" class="group p-3 rounded-xl cursor-pointer transition border relative ${
            isActive 
              ? 'bg-brand-50/70 dark:bg-brand-950/40 border-brand-200 dark:border-brand-800 shadow-xs' 
              : 'bg-white dark:bg-slate-800/40 border-slate-200/70 dark:border-slate-800/80 hover:bg-slate-50 dark:hover:bg-slate-800/70'
          }">
            ${isActive ? '<div class="absolute left-0 top-3 bottom-3 w-1 bg-brand-600 rounded-r-full"></div>' : ''}
            <div class="flex items-start justify-between gap-1 mb-1 pl-1">
              <h4 class="font-semibold text-sm line-clamp-1 ${isActive ? 'text-brand-900 dark:text-brand-200' : 'text-slate-800 dark:text-slate-200'}">
                ${note.title.trim() || 'Untitled Note'}
              </h4>
              <div class="flex items-center gap-1 shrink-0">
                ${note.favorite ? '<i data-lucide="star" class="w-3.5 h-3.5 fill-amber-400 text-amber-400"></i>' : ''}
                ${note.pinned ? '<i data-lucide="pin" class="w-3.5 h-3.5 text-amber-500 fill-amber-500"></i>' : ''}
              </div>
            </div>
            <p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2 leading-relaxed mb-2 pl-1">${snippet}</p>
            <div class="flex items-center gap-2 text-[11px] text-slate-400 dark:text-slate-500 pl-1">
              <span class="font-medium text-slate-600 dark:text-slate-300">${note.category}</span>
              <span>·</span>
              <span>${dateStr}</span>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    function selectNote(id) {
      state.activeNoteId = id;
      loadActiveNote();
      renderNotesList();
      if (window.innerWidth < 1024) closeSidebar();
    }

    function loadActiveNote() {
      const note = state.notes.find(n => n.id === state.activeNoteId);
      if (!note) {
        const remaining = state.notes.filter(n => !n.trashed);
        if (remaining.length > 0) {
          state.activeNoteId = remaining[0].id;
          loadActiveNote();
          return;
        }
        emptyStateEl.classList.remove('hidden');
        editorContainer.classList.add('hidden');
        formattingBar.classList.add('hidden');
        noteActions.classList.add('hidden');
        return;
      }

      emptyStateEl.classList.add('hidden');
      editorContainer.classList.remove('hidden');
      formattingBar.classList.remove('hidden');
      noteActions.classList.remove('hidden');

      editorTitleEl.value = note.title;
      editorBodyEl.innerHTML = note.content;
      editorTagSelect.value = note.category;

      pinBtn.classList.toggle('text-amber-500', note.pinned);
      favoriteBtn.classList.toggle('text-amber-400', note.favorite);

      updateStats();
    }

    function createNewNote() {
      const newNote = {
        id: 'note-' + Date.now(),
        title: '',
        content: '',
        category: (state.activeFilter !== 'all' && state.activeFilter !== 'pinned' && state.activeFilter !== 'favorite' && state.activeFilter !== 'trash') ? state.activeFilter : 'Personal',
        pinned: false,
        favorite: false,
        trashed: false,
        updatedAt: new Date().toISOString()
      };
      state.notes.unshift(newNote);
      state.activeNoteId = newNote.id;
      if (state.activeFilter === 'trash') setFilter('all');
      saveData();
      renderNotesList();
      loadActiveNote();
      editorTitleEl.focus();
      if (window.innerWidth < 1024) closeSidebar();
    }

    function updateStats() {
      const text = stripHtml(editorBodyEl.innerHTML).trim();
      const chars = text.length;
      const words = text ? text.split(/\s+/).filter(Boolean).length : 0;
      document.getElementById('word-count').textContent = `${words} ${words === 1 ? 'word' : 'words'}`;
      document.getElementById('char-count').textContent = `${chars} characters`;
      document.getElementById('reading-time').textContent = `${Math.max(1, Math.ceil(words / 200))} min read`;
    }

    function triggerAutoSave() {
      if (!state.activeNoteId) return;
      autosaveStatus.innerHTML = `
        <i data-lucide="loader-2" class="w-3.5 h-3.5 text-amber-500 animate-spin"></i>
        <span class="text-amber-600 dark:text-amber-400 font-medium">Saving...</span>
      `;
      lucide.createIcons();

      clearTimeout(autoSaveTimeout);
      autoSaveTimeout = setTimeout(() => {
        const note = state.notes.find(n => n.id === state.activeNoteId);
        if (note) {
          note.title = editorTitleEl.value;
          note.content = editorBodyEl.innerHTML;
          note.category = editorTagSelect.value;
          note.updatedAt = new Date().toISOString();
          saveData();
          renderNotesList();
          updateStats();
          autosaveStatus.innerHTML = `
            <i data-lucide="check-circle-2" class="w-3.5 h-3.5 text-emerald-500"></i>
            <span class="font-medium text-slate-500 dark:text-slate-400">Saved</span>
          `;
          lucide.createIcons();
        }
      }, 350);
    }

    function formatDoc(command, value = null) {
      document.execCommand(command, false, value);
      editorBodyEl.focus();
      triggerAutoSave();
    }

    function insertCodeSnippet() {
      const sel = window.getSelection();
      const text = sel ? sel.toString() : '// Code snippet';
      const pre = `<pre><code>${text || '// Your code here'}</code></pre><p></p>`;
      document.execCommand('insertHTML', false, pre);
      triggerAutoSave();
    }

    function showToast(msg, actionText, actionCallback) {
      const toast = document.getElementById('toast');
      const msgEl = document.getElementById('toast-message');
      const actionEl = document.getElementById('toast-action');
      msgEl.textContent = msg;
      if (actionText && actionCallback) {
        actionEl.textContent = actionText;
        actionEl.onclick = () => { actionCallback(); toast.classList.add('hidden'); };
        actionEl.classList.remove('hidden');
      } else {
        actionEl.classList.add('hidden');
      }
      toast.classList.remove('hidden');
      setTimeout(() => toast.classList.add('hidden'), 4000);
    }

    function deleteCurrentNote() {
      const note = state.notes.find(n => n.id === state.activeNoteId);
      if (!note) return;

      if (note.trashed) {
        if (!confirm('Permanently delete this note?')) return;
        state.notes = state.notes.filter(n => n.id !== note.id);
        saveData();
        state.activeNoteId = null;
        renderNotesList();
        loadActiveNote();
        showToast('Note permanently deleted');
        return;
      }

      note.trashed = true;
      saveData();
      showToast('Moved to trash', 'Undo', () => {
        note.trashed = false;
        saveData();
        renderNotesList();
        selectNote(note.id);
      });
      renderNotesList();
      const remaining = state.notes.filter(n => !n.trashed);
      state.activeNoteId = remaining[0]?.id || null;
      loadActiveNote();
    }

    function setupEventListeners() {
      editorTitleEl.addEventListener('input', triggerAutoSave);
      editorBodyEl.addEventListener('input', triggerAutoSave);
      editorTagSelect.addEventListener('change', triggerAutoSave);

      document.getElementById('new-note-btn').addEventListener('click', createNewNote);
      deleteBtn.addEventListener('click', deleteCurrentNote);

      pinBtn.addEventListener('click', () => {
        const note = state.notes.find(n => n.id === state.activeNoteId);
        if (note) {
          note.pinned = !note.pinned;
          saveData();
          renderNotesList();
          loadActiveNote();
        }
      });

      favoriteBtn.addEventListener('click', () => {
        const note = state.notes.find(n => n.id === state.activeNoteId);
        if (note) {
          note.favorite = !note.favorite;
          saveData();
          renderNotesList();
          loadActiveNote();
        }
      });

      document.getElementById('duplicate-note-btn').addEventListener('click', () => {
        const note = state.notes.find(n => n.id === state.activeNoteId);
        if (note) {
          const dup = { ...note, id: 'note-' + Date.now(), title: (note.title || 'Untitled') + ' (Copy)', pinned: false, updatedAt: new Date().toISOString() };
          state.notes.unshift(dup);
          state.activeNoteId = dup.id;
          saveData();
          renderNotesList();
          loadActiveNote();
          showToast('Note duplicated');
        }
      });

      document.getElementById('export-md-btn').addEventListener('click', () => {
        const note = state.notes.find(n => n.id === state.activeNoteId);
        if (!note) return;
        const plain = `# ${note.title}\n\n${stripHtml(note.content)}`;
        const blob = new Blob([plain], { type: 'text/markdown' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${(note.title || 'untitled').toLowerCase().replace(/\s+/g, '-')}.md`;
        a.click();
      });

      document.getElementById('add-tag-prompt').addEventListener('click', () => {
        const name = prompt('Enter new tag/category name:');
        if (name && name.trim()) {
          const trimmed = name.trim();
          if (!state.categories.includes(trimmed)) {
            state.categories.push(trimmed);
            saveCategories();
            renderCategoryPills();
            setFilter(trimmed);
          }
        }
      });

      // Search
      searchInput.addEventListener('input', (e) => {
        state.searchQuery = e.target.value;
        clearSearchBtn.classList.toggle('hidden', !state.searchQuery);
        renderNotesList();
      });

      clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        state.searchQuery = '';
        clearSearchBtn.classList.add('hidden');
        renderNotesList();
      });

      // Filter tabs
      document.querySelectorAll('.filter-tab').forEach(btn => {
        btn.addEventListener('click', () => setFilter(btn.dataset.filter));
      });

      // Theme
      document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

      // Mobile sidebar
      document.getElementById('open-sidebar-btn').addEventListener('click', openSidebar);
      document.getElementById('close-sidebar-btn').addEventListener('click', closeSidebar);
      sidebarOverlay.addEventListener('click', closeSidebar);

      // Keyboard shortcuts
      window.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'n') {
          e.preventDefault();
          createNewNote();
        }
      });
    }

    function openSidebar() {
      sidebar.classList.remove('-translate-x-full');
      sidebarOverlay.classList.remove('hidden');
    }

    function closeSidebar() {
      sidebar.classList.add('-translate-x-full');
      sidebarOverlay.classList.add('hidden');
    }

    function exportJSONBackup() {
      const blob = new Blob([JSON.stringify(state.notes, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `fenote-backup-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      showToast('Backup exported');
    }

    function importJSONBackup(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const data = JSON.parse(event.target.result);
          if (Array.isArray(data)) {
            state.notes = data;
            saveData();
            renderNotesList();
            loadActiveNote();
            showToast(`Imported ${data.length} notes`);
          }
        } catch (err) {
          alert('Invalid backup file');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
